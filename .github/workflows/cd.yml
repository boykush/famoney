name: CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bff: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.bff }}
      expense: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.expense }}
      family: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.family }}
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.web }}
      sha_short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            bff:
              - 'server/bff/**'
            expense:
              - 'server/expense/**'
            family:
              - 'server/family/**'
            web:
              - 'web/**'

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: bff-service
            context: server/bff
            dockerfile: server/bff/Dockerfile
            changed: ${{ needs.changes.outputs.bff }}
          - service: expense-service
            context: server/expense
            dockerfile: server/expense/Dockerfile
            changed: ${{ needs.changes.outputs.expense }}
          - service: expense-migration
            context: server/expense
            dockerfile: server/expense/Dockerfile.migrate
            changed: ${{ needs.changes.outputs.expense }}
          - service: family-service
            context: server/family
            dockerfile: server/family/Dockerfile
            changed: ${{ needs.changes.outputs.family }}
          - service: family-migration
            context: server/family
            dockerfile: server/family/Dockerfile.migrate
            changed: ${{ needs.changes.outputs.family }}
          - service: web-service
            context: web
            dockerfile: web/Dockerfile
            changed: ${{ needs.changes.outputs.web }}
    steps:
      - if: matrix.changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - if: matrix.changed == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: matrix.changed == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: matrix.changed == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ needs.changes.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.changes.outputs.sha_short }}
    steps:
      # Credentials must persist: the final step pushes manifest changes back.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0

      - name: Update BFF image
        if: needs.changes.outputs.bff == 'true'
        run: |
          cd k8s/base/workloads/bff
          kustomize edit set image "bff-service=${REGISTRY}/bff-service:${TAG}"

      - name: Update Expense images
        if: needs.changes.outputs.expense == 'true'
        run: |
          cd k8s/base/workloads/expense
          kustomize edit set image "expense-service=${REGISTRY}/expense-service:${TAG}"
          kustomize edit set image "expense-migration=${REGISTRY}/expense-migration:${TAG}"

      - name: Update Family images
        if: needs.changes.outputs.family == 'true'
        run: |
          cd k8s/base/workloads/family
          kustomize edit set image "family-service=${REGISTRY}/family-service:${TAG}"
          kustomize edit set image "family-migration=${REGISTRY}/family-migration:${TAG}"

      - name: Update Web image
        if: needs.changes.outputs.web == 'true'
        run: |
          cd k8s/base/workloads/web
          kustomize edit set image "web-service=${REGISTRY}/web-service:${TAG}"

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: update image tags to ${GITHUB_SHA::7}"
            git pull --rebase origin main
            git push
          fi
