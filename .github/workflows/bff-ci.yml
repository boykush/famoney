name: BFF CI

on:
  pull_request:
    paths:
      - 'server/bff/**'
      - '.github/workflows/bff-ci.yml'
      - '.github/actions/go-ci/**'
  push:
    branches:
      - main
    paths:
      - 'server/bff/**'
      - '.github/workflows/bff-ci.yml'
      - '.github/actions/go-ci/**'

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Go CI
        uses: ./.github/actions/go-ci
        with:
          service: bff
